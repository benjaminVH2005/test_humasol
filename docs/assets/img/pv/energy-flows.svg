<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 310' width='1000' height='310' role='img' aria-label='Hourly energy flows used to size the system'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='context-stroke'/></marker></defs><rect width='1000' height='310' fill='white'/><rect x='40' y='50' width='160' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='120.0' y='77.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Solar yield</text><text x='120.0' y='96.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>(1)</text><rect x='420' y='50' width='170' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='505.0' y='77.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Loads</text><text x='505.0' y='96.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>(2) charging schedule</text><rect x='230' y='190' width='170' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='315.0' y='217.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Station battery</text><text x='315.0' y='236.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>(3) charge · (4) discharge</text><rect x='800' y='50' width='160' height='60' rx='8' fill='#F2F2F2' stroke='#999' stroke-width='1.5'/><text x='880.0' y='77.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Grid</text><text x='880.0' y='96.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>(5) what is missing</text><line x1='200' y1='80' x2='418' y2='80' stroke='#555' stroke-width='2' marker-end='url(#a)'/><text x='309.0' y='74.0' text-anchor='middle' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>direct use</text><line x1='160' y1='110' x2='250' y2='188' stroke='#555' stroke-width='2' marker-end='url(#a)'/><text x='170' y='160' text-anchor='middle' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>(3) surplus</text><line x1='380' y1='188' x2='470' y2='112' stroke='#555' stroke-width='2' marker-end='url(#a)'/><text x='470' y='160' text-anchor='middle' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>(4) shortage</text><line x1='798' y1='80' x2='592' y2='80' stroke='#999' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='700' y='72' text-anchor='middle' font-size='12' fill='#999' font-family='Inter,Segoe UI,Arial,sans-serif'>(5) grid</text><text x='500' y='290' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>For every hour of a typical day in each month: solar first goes to the loads, the surplus charges the battery, the battery covers shortages, the grid covers the rest.</text></svg>
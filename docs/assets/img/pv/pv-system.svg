<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 290' width='1000' height='290' role='img' aria-label='Overview of a Humasol PV system'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='context-stroke'/></marker></defs><rect width='1000' height='290' fill='white'/><rect x='20' y='40' width='150' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='95.0' y='67.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Solar panels</text><text x='95.0' y='86.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>DC, e.g. 550 Wp each</text><rect x='230' y='40' width='150' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='305.0' y='67.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>MPPT</text><text x='305.0' y='86.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>charge controller</text><rect x='440' y='40' width='150' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='515.0' y='67.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>DC busbar</text><text x='515.0' y='86.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>+ fuses</text><rect x='440' y='170' width='150' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='515.0' y='197.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Batteries</text><text x='515.0' y='216.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>48 V, e.g. LiFePO4</text><rect x='650' y='40' width='150' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='725.0' y='67.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Inverter/charger</text><text x='725.0' y='86.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>e.g. MultiPlus-II</text><rect x='860' y='40' width='120' height='60' rx='8' fill='#FFF4E5' stroke='#F19E38' stroke-width='1.5'/><text x='920.0' y='67.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Loads</text><text x='920.0' y='86.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>230 V AC</text><rect x='650' y='170' width='150' height='60' rx='8' fill='#F2F2F2' stroke='#999' stroke-width='1.5'/><text x='725.0' y='197.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Grid / generator</text><text x='725.0' y='216.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>backup (hybrid)</text><rect x='230' y='170' width='150' height='60' rx='8' fill='#EAF4FF' stroke='#4A90D9' stroke-width='1.5'/><text x='305.0' y='197.0' text-anchor='middle' font-size='15' font-weight='600' fill='#333' font-family='Inter,Segoe UI,Arial,sans-serif'>Cerbo GX</text><text x='305.0' y='216.0' text-anchor='middle' font-size='12' fill='#666' font-family='Inter,Segoe UI,Arial,sans-serif'>monitoring → VRM</text><line x1='170' y1='70' x2='228' y2='70' stroke='#555' stroke-width='2' marker-end='url(#a)'/><text x='199.0' y='64.0' text-anchor='middle' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>DC</text><line x1='380' y1='70' x2='438' y2='70' stroke='#555' stroke-width='2' marker-end='url(#a)'/><text x='409.0' y='64.0' text-anchor='middle' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>DC</text><line x1='515' y1='100' x2='515' y2='168' stroke='#555' stroke-width='2' marker-end='url(#a)' marker-start='url(#a)'/><text x='525' y='138' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>charge / discharge</text><line x1='590' y1='70' x2='648' y2='70' stroke='#555' stroke-width='2' marker-end='url(#a)'/><text x='619.0' y='64.0' text-anchor='middle' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>DC</text><line x1='800' y1='70' x2='858' y2='70' stroke='#555' stroke-width='2' marker-end='url(#a)'/><text x='829.0' y='64.0' text-anchor='middle' font-size='12' fill='#555' font-family='Inter,Segoe UI,Arial,sans-serif'>AC</text><line x1='725' y1='170' x2='725' y2='102' stroke='#999' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#a)'/><text x='760' y='140' text-anchor='middle' font-size='12' fill='#999' font-family='Inter,Segoe UI,Arial,sans-serif'>AC in</text><line x1='380' y1='200' x2='438' y2='200' stroke='#4A90D9' stroke-width='1.5' stroke-dasharray='3 3'/><text x='500' y='275' text-anchor='middle' font-size='12' fill='#888' font-family='Inter,Segoe UI,Arial,sans-serif'>Solid lines: energy flow · dashed grey: only in a hybrid system · dashed blue: data</text></svg>
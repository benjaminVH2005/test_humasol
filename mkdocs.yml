site_name: Humasol Kennisbank
site_description: Alle kennis over onze projecten, technologieën en partners op één plek
# Pas dit aan naar jullie eigen GitHub-repository:
repo_url: https://github.com/benjaminVH2005/kennisbank
edit_uri: edit/main/docs/

theme:
  name: material
  language: nl
  font: false                # gebruik systeemlettertypes (sneller, geen externe fonts)
  palette:
    primary: green
    accent: amber
  features:
    - navigation.sections    # hoofdstukken als koppen in het menu
    - navigation.indexes     # index.md wordt de overzichtspagina van een map
    - navigation.top         # knop "terug naar boven"
    - search.suggest
    - search.highlight
    - content.action.edit    # potloodje "bewerk deze pagina"

plugins:
  - search:
      lang: nl

markdown_extensions:
  - admonition               # gekleurde kaders: !!! tip, !!! warning ...
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

# Volgorde van het menu. Laat je dit weg, dan bouwt MkDocs het menu
# automatisch op uit de mappen (alfabetisch).
nav:
  - Start hier: index.md
  - "Deel 1: Community": community.md

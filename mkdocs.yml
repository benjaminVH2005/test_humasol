site_name: Humasol Knowledge Hub
site_description: All knowledge about our projects, technologies and partners in one place
repo_url: https://github.com/benjaminVH2005/test_humasol
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  palette:
    primary: green
    accent: amber
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Per country:
      - countries/index.md
      - Liberia:
          - A. General information: countries/liberia/index.md
          - B. Projects: countries/liberia/projects.md
          - C. Partners & companies: countries/liberia/partners.md
      - Kenya:
          - A. General information: countries/kenya/index.md
          - B. Projects: countries/kenya/projects.md
          - C. Partners & companies: countries/kenya/partners.md
      - Bolivia:
          - A. General information: countries/bolivia/index.md
          - B. Projects: countries/bolivia/projects.md
          - C. Partners & companies: countries/bolivia/partners.md
      - Uganda:
          - A. General information: countries/uganda/index.md
          - B. Projects: countries/uganda/projects.md
          - C. Partners & companies: countries/uganda/partners.md
  - Per technology:
      - technologies/index.md
      - PV:
          - technologies/pv/index.md
          - A. Background & research: technologies/pv/background.md
          - B. Technology:
              - technologies/pv/technology/index.md
              - Main components:
                  - Solar panels: technologies/pv/technology/components/panels.md
                  - Inverter: technologies/pv/technology/components/inverter.md
                  - Batteries: technologies/pv/technology/components/batteries.md
                  - Charge controller: technologies/pv/technology/components/charge-controller.md
              - System types: technologies/pv/technology/system-types.md
              - Sizing: technologies/pv/technology/sizing.md
          - C. Maintenance & sustainability: technologies/pv/maintenance.md
          - D. Economics: technologies/pv/economics.md
          - E. Practical installation: technologies/pv/installation.md
          - F. Planning: technologies/pv/planning.md
      - Water distribution:
          - technologies/water-distribution/index.md
          - A. Background & research: technologies/water-distribution/background.md
          - B. Technology:
              - technologies/water-distribution/technology/index.md
              - Main components:
                  - Pump: technologies/water-distribution/technology/components/pump.md
                  - Storage tank: technologies/water-distribution/technology/components/storage-tank.md
                  - Pipe network: technologies/water-distribution/technology/components/pipe-network.md
                  - Tap points: technologies/water-distribution/technology/components/tap-points.md
              - System types: technologies/water-distribution/technology/system-types.md
              - Sizing: technologies/water-distribution/technology/sizing.md
          - C. Maintenance & sustainability: technologies/water-distribution/maintenance.md
          - D. Economics: technologies/water-distribution/economics.md
          - E. Practical installation: technologies/water-distribution/installation.md
          - F. Planning: technologies/water-distribution/planning.md
      - Biogas:
          - technologies/biogas/index.md
          - A. Background & research: technologies/biogas/background.md
          - B. Technology:
              - technologies/biogas/technology/index.md
              - Main components:
                  - Digester: technologies/biogas/technology/components/digester.md
                  - Gas storage: technologies/biogas/technology/components/gas-storage.md
                  - Gas pipes & burners: technologies/biogas/technology/components/gas-pipes-burners.md
                  - Digestate (by-product): technologies/biogas/technology/components/digestate.md
              - System types: technologies/biogas/technology/system-types.md
              - Sizing: technologies/biogas/technology/sizing.md
          - C. Maintenance & sustainability: technologies/biogas/maintenance.md
          - D. Economics: technologies/biogas/economics.md

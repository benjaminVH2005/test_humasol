site_name: Humasol Knowledge Hub
site_description: Humasol's knowledge per country and per technology, in one place
repo_url: https://github.com/benjaminVH2005/test_humasol
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  palette:
    primary: orange
    accent: amber
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Per country:
      - countries/index.md
      - Liberia:
          - A. Context: countries/liberia/index.md
          - B. Past projects: countries/liberia/projects.md
          - C. Partners: countries/liberia/partners.md
      - Kenya:
          - A. Context: countries/kenya/index.md
          - B. Past projects: countries/kenya/projects.md
          - C. Partners: countries/kenya/partners.md
      - Bolivia:
          - A. Context: countries/bolivia/index.md
          - B. Past projects: countries/bolivia/projects.md
          - C. Partners: countries/bolivia/partners.md
      - Uganda:
          - A. Context: countries/uganda/index.md
          - B. Past projects: countries/uganda/projects.md
          - C. Partners: countries/uganda/partners.md
  - Per technology:
      - technologies/index.md
      - PV:
          - technologies/pv/index.md
          - A. Background information: technologies/pv/background.md
          - B. Introduction to the technology: technologies/pv/introduction.md
          - C. Main components:
              - technologies/pv/components/index.md
              - Solar panels: technologies/pv/components/panels.md
              - Inverter: technologies/pv/components/inverter.md
              - Batteries: technologies/pv/components/batteries.md
              - Charge controller: technologies/pv/components/charge-controller.md
          - D. Different system types: technologies/pv/system-types.md
          - E. Research: technologies/pv/research.md
          - F. How to size the system: technologies/pv/sizing.md
          - G. Socio-economic: technologies/pv/socio-economic.md
          - H. Maintenance: technologies/pv/maintenance.md
          - I. Practical installation: technologies/pv/installation.md
          - J. Watch out: technologies/pv/watch-out.md
      - Water distribution:
